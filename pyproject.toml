[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fresnel-doe"
version = "0.1.0"
description = "Physics-informed neural synthesis of a four-plane phase-only diffractive optical element"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4,<3",
  "numpy>=1.26,<3",
  "Pillow>=10.1,<13",
  "scikit-image>=0.24,<1",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6.29,<7"]

[project.scripts]
fresnel-doe = "doe.cli:main"

[tool.setuptools.packages.find]
include = ["doe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
